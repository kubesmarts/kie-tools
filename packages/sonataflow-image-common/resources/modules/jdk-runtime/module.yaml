schema_version: 1
name: org.kie.kogito.jdk.runtime
version: "main"
description: >-
  Installs the OpenJDK 17 JRE (headless), previously provided by the
  ubi9/openjdk-17-runtime base image, and exposes JAVA_HOME. Used by the
  runtime images that only need to execute pre-built Quarkus applications.

envs:
  - name: "JAVA_HOME"
    value: "/usr/lib/jvm/jre"
  - name: "JAVA_VENDOR"
    value: "openjdk"
  - name: "JAVA_VERSION"
    value: "17"
  - name: "LANG"
    value: "C.utf8"

packages:
  manager: microdnf
  install:
    - java-17-openjdk-headless

execute:
  - script: configure
